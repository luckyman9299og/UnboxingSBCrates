<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crate Unboxing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .crate-buttons button {
      margin: 10px;
      padding: 15px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #333;
      color: #fff;
      transition: 0.2s;
    }
    .crate-buttons button:hover {
      background: #555;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }
    .rarity {
      display: inline-block;
      margin-top: 15px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <h1>Crate Unboxing Simulator</h1>
  <div class="crate-buttons">
    <button onclick="openCrate('standard')">Standard Crate</button>
    <button onclick="openCrate('megarock')">Megarock Crate</button>
    <button onclick="openCrate('bob')">Bob Crate</button>
    <button onclick="openCrate('barzil')">Barzil Crate</button>
    <button onclick="openCrate('overkill')">Overkill Crate</button>
  </div>

  <div id="result"></div>
  <div id="claim-area"></div>

  <script>
    const lootTables = {
      standard: {
        uncommon: {
          chance: 79,
          items: ["Slime", "Water", "Leaves", "Ink", "Forcefield", "Explosion", "Cartoony Water", "Butterflies", "Blue Explosion", "Birds"]
        },
        rare: {
          chance: 18,
          items: ["Pixilated Lightning", "Plasma Blast", "Painted", "Fireworks"]
        },
        epic: {
          chance: 2.5,
          items: ["Psychic", "Poisonous"]
        },
        legendary: {
          chance: 0.5,
          items: ["Lightning"]
        }
      }
    };

    function openCrate(type) {
      if (type !== "standard") {
        document.getElementById("result").innerHTML = "⚠️ This crate isn't set up yet!";
        document.getElementById("claim-area").innerHTML = "";
        return;
      }

      let roll = Math.random() * 100;
      let rarity = "";
      let item = "";

      const crate = lootTables.standard;
      if (roll < crate.uncommon.chance) {
        rarity = "Uncommon 🟢";
        item = randomPick(crate.uncommon.items);
      } else if (roll < crate.uncommon.chance + crate.rare.chance) {
        rarity = "Rare 🔵";
        item = randomPick(crate.rare.items);
      } else if (roll < crate.uncommon.chance + crate.rare.chance + crate.epic.chance) {
        rarity = "Epic 🟣";
        item = randomPick(crate.epic.items);
      } else {
        rarity = "Legendary 🟡";
        item = randomPick(crate.legendary.items);
      }

      document.getElementById("result").innerHTML = `🎉 You unboxed: <br> <span class="rarity">${item} (${rarity})</span>`;
      document.getElementById("claim-area").innerHTML = `<button onclick="claimItem()">Claim</button>`;
    }

    function claimItem() {
      document.getElementById("result").innerHTML = "✅ Item claimed!";
      document.getElementById("claim-area").innerHTML = "";
    }

    function randomPick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }
  </script>
</body>
</html>
