<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crate Unbox Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }
    h1 {
      margin: 20px;
    }
    .crate-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .crate-buttons button, #unboxBtn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
      transition: 0.2s;
    }
    .crate-buttons button img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 6px;
    }
    .crate-buttons button:hover, #unboxBtn:hover {
      transform: scale(1.05);
      background: #333;
    }
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    #unboxBtn {
      background: #444;
      padding: 12px 20px;
    }
  </style>
</head>
<body>
  <h1>Crate Unbox Simulator</h1>

  <div class="crate-buttons">
    <button onclick="selectCrate('standard')">
      <img src="https://static.wikia.nocookie.net/roblox-slap-battles/images/1/1b/Standard.png/revision/latest/scale-to-width-down/1000?cb=20250207023547" alt="Standard Crate">
      Standard Crate
    </button>
    <button onclick="selectCrate('megarock')">
      <img src="https://static.wikia.nocookie.net/roblox-slap-battles/images/c/ce/BETTER_MEGAROCK_CRATE_IMAGE.png/revision/latest?cb=20241228175323" alt="Megarock Crate">
      Megarock Crate
    </button>
    <button onclick="selectCrate('bob')">
      <img src="https://static.wikia.nocookie.net/roblox-slap-battles/images/e/e9/My_bob_crate_image_is_better_than_the_old_one.png/revision/latest?cb=20241228175201" alt="Bob Crate">
      Bob Crate
    </button>
    <button onclick="selectCrate('barzil')">
      <img src="https://static.wikia.nocookie.net/roblox-slap-battles/images/9/9d/Barzil_Crate.png/revision/latest/scale-to-width-down/1000?cb=20250707013259" alt="Barzil Crate">
      Barzil Crate
    </button>
    <button onclick="selectCrate('overkill')">
      <img src="https://static.wikia.nocookie.net/roblox-slap-battles/images/d/de/OVERKILLCrate.png/revision/latest/scale-to-width-down/1000?cb=20250328213353" alt="Overkill Crate">
      Overkill Crate
    </button>
  </div>

  <div>
    <button id="unboxBtn" onclick="unbox()" disabled>Unbox</button>
  </div>

  <div id="result"></div>

  <!-- JS stays the same -->
  <script>
    let currentCrate = null;
    const crates = {
      standard: { uncommons: { chance: 79, items: ["slime", "water", "leaves", "ink", "forcefield", "explosion", "cartoony water", "butterflies", "blue explosion", "birds"], color: "🟢" }, rares: { chance: 18, items: ["pixilated lightning", "plasma blast", "painted", "fireworks"], color: "🔵" }, epics: { chance: 2.5, items: ["psychic", "poisonous"], color: "🟣" }, legendary: { chance: 0.5, items: ["lightning"], color: "🟡" } },
      megarock: { uncommons: { chance: 70, items: ["Stop", "Rocks", "Noob", "Moyai", "Lucky", "Fish", "Duckie", "Blossom"], color: "🟢" }, rares: { chance: 26, items: ["Robux", "Pixelated explosion", "Music", "Gold", "Glitched"], color: "🔵" }, epics: { chance: 3.3, items: ["Windy", "Rgb", "Smoked"], color: "🟣" }, legendary: { chance: 0.6, items: ["Glass", "Slashes"], color: "🟡" }, mythic: { chance: 0.1, items: ["Energized"], color: "🔴" } },
      bob: { uncommons: { chance: 60, items: ["Snow", "Retro", "Heart", "Sandy", "Evil", "Bread", "Binary"], color: "🟢" }, rares: { chance: 34, items: ["Light", "Pixel Pubbles", "Rays", "Eye", "Iceshards"], color: "🔵" }, epics: { chance: 5, items: ["Phoenix", "Fractal", "Cursed", "Gravity"], color: "🟣" }, legendary: { chance: 0.85, items: ["Darkness", "Holy"], color: "🟡" }, mythic: { chance: 0.15, items: ["Portal"], color: "🔴" } },
      barzil: { uncommons: { chance: 60, items: ["Erupting Bricks", "Job Application", "Pob's Light Snack", "Snoob Migration", "Falling Boulder", "Basketball Explosion", "Angry Cat", "Evil Cat", "Curious Cat", "Hello Cat"], color: "🟢" }, rares: { chance: 34, items: ["Pondering Orb", "Clocktower Crash", "Oog's Damnation", "Portal Mist"], color: "🔵" }, epics: { chance: 5, items: ["Mortis #1 Fan", "Duel of the Ages", "Minefield"], color: "🟣" }, legendary: { chance: 0.85, items: ["Pablo's Clownery", "Crunchy Explosion"], color: "🟡" }, mythic: { chance: 0.15, items: ["Barzilian Nexus"], color: "🔴" } },
      overkill: { epics: { chance: 80, items: ["Vibrant Supernova", "Sand Tornado", "Rainbomb", "Chilling Fog", "Aquatic Gateway"], color: "🟣" }, legendary: { chance: 18.5, items: ["Toxic Puddle", "Purple Rapture", "Popstar Spectacle"], color: "🟡" }, mythic: { chance: 1.5, items: ["Hellfire Sigil"], color: "🔴" } }
    };

    function selectCrate(crate) {
      currentCrate = crate;
      document.getElementById("unboxBtn").disabled = false;
      document.getElementById("result").innerHTML = `Selected <b>${crate} crate</b>. Press Unbox!`;
    }

    function getRandomItem(crateData) {
      let roll = Math.random() * 100;
      let cumulative = 0;

      if (crateData.uncommons) { cumulative += crateData.uncommons.chance; if (roll <= cumulative) return { item: randomChoice(crateData.uncommons.items), rarity: crateData.uncommons.color }; }
      if (crateData.rares) { cumulative += crateData.rares.chance; if (roll <= cumulative) return { item: randomChoice(crateData.rares.items), rarity: crateData.rares.color }; }
      if (crateData.epics) { cumulative += crateData.epics.chance; if (roll <= cumulative) return { item: randomChoice(crateData.epics.items), rarity: crateData.epics.color }; }
      if (crateData.legendary) { cumulative += crateData.legendary.chance; if (roll <= cumulative) return { item: randomChoice(crateData.legendary.items), rarity: crateData.legendary.color }; }
      if (crateData.mythic) { return { item: randomChoice(crateData.mythic.items), rarity: crateData.mythic.color }; }
      return { item: "Unknown", rarity: "" };
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function unbox() {
      if (!currentCrate) return;
      const crateData = crates[currentCrate];
      if (!crateData.epics && !crateData.uncommons) {
        document.getElementById("result").innerHTML = "This crate isn't ready yet!";
        return;
      }
      const result = getRandomItem(crateData);
      document.getElementById("result").innerHTML = `You unboxed: ${result.rarity} <b>${result.item}</b>`;
    }
  </script>
</body>
</html>
