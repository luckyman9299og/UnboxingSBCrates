<script>
  let currentCrate = null;

  const crates = {
    standard: {
      uncommons: {
        chance: 79,
        items: ["slime", "water", "leaves", "ink", "forcefield", "explosion", "cartoony water", "butterflies", "blue explosion", "birds"],
        color: "🟢"
      },
      rares: {
        chance: 18,
        items: ["pixilated lightning", "plasma blast", "painted", "fireworks"],
        color: "🔵"
      },
      epics: {
        chance: 2.5,
        items: ["psychic", "poisonous"],
        color: "🟣"
      },
      legendary: {
        chance: 0.5,
        items: ["lightning"],
        color: "🟡"
      }
    },
    megarock: {
      uncommons: {
        chance: 70,
        items: ["Stop", "Rocks", "Noob", "Moyai", "Lucky", "Fish", "Duckie", "Blossom"],
        color: "🟢"
      },
      rares: {
        chance: 26,
        items: ["Robux", "Pixelated explosion", "Music", "Gold", "Glitched"],
        color: "🔵"
      },
      epics: {
        chance: 3.3,
        items: ["Windy", "Rgb", "Smoked"],
        color: "🟣"
      },
      legendary: {
        chance: 0.6,
        items: ["Glass", "Slashes"],
        color: "🟡"
      },
      mythic: {
        chance: 0.1,
        items: ["Energized"],
        color: "🔴"
      }
    },
    bob: {
      uncommons: {
        chance: 60,
        items: ["Snow", "Retro", "Heart", "Sandy", "Evil", "Bread", "Binary"],
        color: "🟢"
      },
      rares: {
        chance: 34,
        items: ["Light", "Pixel Pubbles", "Rays", "Eye", "Iceshards"],
        color: "🔵"
      },
      epics: {
        chance: 5,
        items: ["Phoenix", "Fractal", "Cursed", "Gravity"],
        color: "🟣"
      },
      legendary: {
        chance: 0.85,
        items: ["Darkness", "Holy"],
        color: "🟡"
      },
      mythic: {
        chance: 0.15,
        items: ["Portal"],
        color: "🔴"
      }
    },
    barzil: {},
    overkill: {}
  };

  function selectCrate(crate) {
    currentCrate = crate;
    document.getElementById("unboxBtn").disabled = false;
    document.getElementById("result").innerHTML = `Selected <b>${crate} crate</b>. Press Unbox!`;
  }

  function getRandomItem(crateData) {
    let roll = Math.random() * 100;
    let cumulative = 0;

    // Uncommons
    if (crateData.uncommons) {
      cumulative += crateData.uncommons.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.uncommons.items),
          rarity: crateData.uncommons.color
        };
      }
    }

    // Rares
    if (crateData.rares) {
      cumulative += crateData.rares.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.rares.items),
          rarity: crateData.rares.color
        };
      }
    }

    // Epics
    if (crateData.epics) {
      cumulative += crateData.epics.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.epics.items),
          rarity: crateData.epics.color
        };
      }
    }

    // Legendary
    if (crateData.legendary) {
      cumulative += crateData.legendary.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.legendary.items),
          rarity: crateData.legendary.color
        };
      }
    }

    // Mythic
    if (crateData.mythic) {
      return {
        item: randomChoice(crateData.mythic.items),
        rarity: crateData.mythic.color
      };
    }

    return { item: "Unknown", rarity: "" };
  }

  function randomChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function unbox() {
    if (!currentCrate) return;
    const crateData = crates[currentCrate];
    if (!crateData.uncommons) {
      document.getElementById("result").innerHTML = "This crate isn't ready yet!";
      return;
    }
    const result = getRandomItem(crateData);
    document.getElementById("result").innerHTML = `You unboxed: ${result.rarity} <b>${result.item}</b>`;
  }
</script>
