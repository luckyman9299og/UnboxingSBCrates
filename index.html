<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crate Unbox Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }
    h1 {
      margin: 20px;
    }
    .crate-buttons button, #unboxBtn, #rerollBtn {
      margin: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .crate-buttons button:hover, #unboxBtn:hover, #rerollBtn:hover {
      transform: scale(1.05);
    }
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Crate Unbox Simulator</h1>

  <div class="crate-buttons">
    <button onclick="selectCrate('standard')">Standard Crate</button>
    <button onclick="selectCrate('megarock')">Megarock Crate</button>
    <button onclick="selectCrate('bob')">Bob Crate</button>
    <button onclick="selectCrate('barzil')">Barzil Crate</button>
    <button onclick="selectCrate('overkill')">Overkill Crate</button>
  </div>

  <div>
    <button id="unboxBtn" onclick="unbox()" disabled>Unbox</button>
    <button id="rerollBtn" onclick="reroll()" disabled>Reroll</button>
  </div>

  <div id="result"></div>

  <script>
    let currentCrate = null;
    let lastItem = null;

    const crates = {
      standard: {
        uncommons: {
          chance: 79,
          items: ["slime", "water", "leaves", "ink", "forcefield", "explosion", "cartoony water", "butterflies", "blue explosion", "birds"],
          color: "🟢"
        },
        rares: {
          chance: 18,
          items: ["pixilated lightning", "plasma blast", "painted", "fireworks"],
          color: "🔵"
        },
        epics: {
          chance: 2.5,
          items: ["psychic", "poisonous"],
          color: "🟣"
        },
        legendary: {
          chance: 0.5,
          items: ["lightning"],
          color: "🟡"
        }
      },
      megarock: {}, // TODO: add loot table
      bob: {},      // TODO: add loot table
      barzil: {},   // TODO: add loot table
      overkill: {}  // TODO: add loot table
    };

    function selectCrate(crate) {
      currentCrate = crate;
      document.getElementById("unboxBtn").disabled = false;
      document.getElementById("rerollBtn").disabled = true;
      document.getElementById("result").innerHTML = `Selected <b>${crate} crate</b>. Press Unbox!`;
    }

    function getRandomItem(crateData) {
      let roll = Math.random() * 100;
      let cumulative = 0;

      // Uncommons
      cumulative += crateData.uncommons.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.uncommons.items),
          rarity: crateData.uncommons.color
        };
      }

      // Rares
      cumulative += crateData.rares.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.rares.items),
          rarity: crateData.rares.color
        };
      }

      // Epics
      cumulative += crateData.epics.chance;
      if (roll <= cumulative) {
        return {
          item: randomChoice(crateData.epics.items),
          rarity: crateData.epics.color
        };
      }

      // Legendary
      return {
        item: randomChoice(crateData.legendary.items),
        rarity: crateData.legendary.color
      };
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function unbox() {
      if (!currentCrate) return;
      const crateData = crates[currentCrate];
      if (!crateData.uncommons) {
        document.getElementById("result").innerHTML = "This crate isn't ready yet!";
        return;
      }
      lastItem = getRandomItem(crateData);
      document.getElementById("result").innerHTML = `You unboxed: ${lastItem.rarity} <b>${lastItem.item}</b>`;
      document.getElementById("rerollBtn").disabled = false;
    }

    function reroll() {
      if (!currentCrate || !lastItem) return;
      const crateData = crates[currentCrate];
      lastItem = getRandomItem(crateData);
      document.getElementById("result").innerHTML = `You rerolled and got: ${lastItem.rarity} <b>${lastItem.item}</b>`;
    }
  </script>
</body>
</html>
